# .github/workflows/detect-clang.yml

name: Detect Clang on Runners

on:
  workflow_dispatch:

jobs:
  detect-clang-x86:
    name: Detect Clang (windows-2025)
    runs-on: windows-2025
    steps:
      - name: Detect Clang
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Clang Detection - windows-2025 (x86_64)"
          Write-Host "=========================================="

          Write-Host "`n[Runner Info]"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

          Write-Host "`n[Active Clang in PATH]"
          $clangExe   = Get-Command clang    -ErrorAction SilentlyContinue
          $clangClExe = Get-Command clang-cl -ErrorAction SilentlyContinue

          if ($clangExe)   { Write-Host "clang    -> $($clangExe.Source)";   & $clangExe.Source --version }
          else              { Write-Host "clang    -> NOT FOUND in PATH" }

          if ($clangClExe) { Write-Host "clang-cl -> $($clangClExe.Source)"; & $clangClExe.Source --version }
          else              { Write-Host "clang-cl -> NOT FOUND in PATH" }

          Write-Host "`n[All Clang Installations Found]"
          $searchPaths = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\LLVM\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin",
            "C:\ProgramData\chocolatey\bin"
          )
          foreach ($path in $searchPaths) {
            $exe   = Join-Path $path "clang.exe"
            $exeCl = Join-Path $path "clang-cl.exe"
            if (Test-Path $exe)   { Write-Host "`nFound: $exe";   & $exe --version }
            if (Test-Path $exeCl) { Write-Host "Found: $exeCl"; & $exeCl --version }
          }

          Write-Host "`n[Full PATH Entries]"
          $env:PATH -split ";" | ForEach-Object { Write-Host "  $_" }

  detect-clang-arm:
    name: Detect Clang (windows-11-arm)
    runs-on: windows-11-arm
    steps:
      - name: Detect Clang
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host " Clang Detection - windows-11-arm (ARM64)"
          Write-Host "=========================================="

          Write-Host "`n[Runner Info]"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

          Write-Host "`n[Active Clang in PATH]"
          $clangExe   = Get-Command clang    -ErrorAction SilentlyContinue
          $clangClExe = Get-Command clang-cl -ErrorAction SilentlyContinue

          if ($clangExe)   { Write-Host "clang    -> $($clangExe.Source)";   & $clangExe.Source --version }
          else              { Write-Host "clang    -> NOT FOUND in PATH" }

          if ($clangClExe) { Write-Host "clang-cl -> $($clangClExe.Source)"; & $clangClExe.Source --version }
          else              { Write-Host "clang-cl -> NOT FOUND in PATH" }

          Write-Host "`n[All Clang Installations Found]"
          $searchPaths = @(
            "C:\Program Files\LLVM\bin",
            "C:\Program Files (x86)\LLVM\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\bin",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\ARM64\bin",
            "C:\ProgramData\chocolatey\bin"
          )
          foreach ($path in $searchPaths) {
            $exe   = Join-Path $path "clang.exe"
            $exeCl = Join-Path $path "clang-cl.exe"
            if (Test-Path $exe)   { Write-Host "`nFound: $exe";   & $exe --version }
            if (Test-Path $exeCl) { Write-Host "Found: $exeCl"; & $exeCl --version }
          }

          Write-Host "`n[Full PATH Entries]"
          $env:PATH -split ";" | ForEach-Object { Write-Host "  $_" }